<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAA AI — One Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #25D366, #128C7E); padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
  .header h1 { font-size: 1.4rem; color: white; }
  .header .stats { margin-left: auto; display: flex; gap: 1.5rem; color: white; font-size: 0.875rem; }
  .header .stat { text-align: center; }
  .header .stat b { display: block; font-size: 1.3rem; }
  .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tab { padding: 0.6rem 1.2rem; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
         color: #94a3b8; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: all 0.15s; }
  .tab.active { background: #25D366; color: white; border-color: #25D366; }
  .tab:hover:not(.active) { background: #334155; color: #e2e8f0; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem;
          margin-bottom: 1rem; transition: border-color 0.15s; }
  .card:hover { border-color: #475569; }
  .card .meta { display: flex; gap: 1rem; font-size: 0.75rem; color: #64748b; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .card .sender { color: #25D366; font-weight: 600; }
  .card .msg { background: #0f172a; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
               font-size: 0.875rem; color: #cbd5e1; border-left: 3px solid #475569; white-space: pre-wrap; }
  .card .draft { background: #052e16; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
                 font-size: 0.875rem; color: #86efac; border-left: 3px solid #16a34a; white-space: pre-wrap; }
  .card .summary { background: rgba(37,211,102,0.08); border-radius: 8px; padding: 0.6rem 0.75rem; margin-bottom: 0.75rem;
                   font-size: 0.75rem; color: #6ee7b7; }
  .msg-label { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.25rem; }
  .btn { padding: 0.55rem 1.1rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8125rem; }
  .btn-approve { background: #25D366; color: #052e16; }
  .btn-approve:hover { background: #2fdf72; }
  .btn-reject { background: #334155; color: #fda4af; border: 1px solid #7f1d1d; }
  .btn-reject:hover { background: #3f2d35; }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .status-badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 700;
                  text-transform: uppercase; }
  .status-pending { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .status-approved { background: rgba(34,197,94,0.15); color: #4ade80; }
  .status-rejected { background: rgba(239,68,68,0.15); color: #f87171; }
  .status-expired { background: rgba(100,116,139,0.15); color: #94a3b8; }
  .empty { text-align: center; padding: 3rem; color: #475569; }
  .pattern-keywords { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }
  .keyword { padding: 0.15rem 0.5rem; background: #334155; border-radius: 4px; font-size: 0.75rem; color: #94a3b8; }
  .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .btn-refresh { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 0.4rem 1rem;
                 border-radius: 6px; cursor: pointer; font-size: 0.8125rem; }
  .btn-refresh:hover { background: #475569; }

  /* WhatsApp session panel */
  .session { border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; background: #111c33; }
  .session h2 { font-size: 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  .session .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .session input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px;
                   padding: 0.55rem 0.8rem; font-size: 0.875rem; width: 220px; }
  .session input:focus { outline: none; border-color: #25D366; }
  .btn-primary { background: #25D366; color: #052e16; }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
  .pill { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 999px; padding: 0.25rem 0.75rem;
          font-size: 0.75rem; font-weight: 700; }
  .pill.ok { background: rgba(34,197,94,0.15); color: #4ade80; }
  .pill.bad { background: rgba(239,68,68,0.15); color: #f87171; }
  .pill.info { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .pill.warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .qr-box { margin-top: 1rem; text-align: center; background: white; border-radius: 12px; padding: 1rem;
            display: inline-block; }
  .qr-box img { width: 220px; height: 220px; image-rendering: pixelated; }
  .hint { font-size: 0.8125rem; color: #64748b; margin-top: 0.6rem; }
  .err { color: #f87171; font-size: 0.8125rem; margin-top: 0.6rem; }
  .sess-line { font-size: 0.8125rem; color: #94a3b8; margin-top: 0.5rem; }
  .sess-line b { color: #e2e8f0; }
</style>
</head>
<body>
<div class="header">
  <h1>🤖 WAA AI — One Dashboard</h1>
  <div class="stats">
    <div class="stat"><b id="pendingCount">-</b>Pending</div>
    <div class="stat"><b id="approvedCount">-</b>Approved</div>
    <div class="stat"><b id="patternCount">-</b>Patterns</div>
  </div>
</div>
<div class="container">

  <!-- WhatsApp session -->
  <div class="session" id="sessionBox">
    <h2>📱 WhatsApp Connection</h2>
    <div id="sessionBody"><div class="hint">Loading session…</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('pending', this)">⏳ Pending</button>
    <button class="tab" onclick="showTab('resolved', this)">📋 History</button>
    <button class="tab" onclick="showTab('patterns', this)">📚 Patterns</button>
  </div>
  <div class="refresh-bar">
    <span style="font-size:0.8125rem;color:#64748b" id="lastRefresh"></span>
    <button class="btn-refresh" onclick="loadAll()">↻ Refresh</button>
  </div>
  <div id="content">Loading...</div>
</div>
<script>
let currentTab = 'pending';
// Server-injected token (__BOT_TOKEN__). Falls back to a prompt if it fails.
window.BOT_TOKEN = "__BOT_TOKEN__";
let apiToken = window.BOT_TOKEN || '';
if (!apiToken) apiToken = prompt('Enter the WAA bot API token:') || '';

function getToken() { return apiToken; }

async function fetchJSON(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Auth-Token': getToken() }, opts.headers || {});
  const res = await fetch(url, opts);
  if (res.status === 401) {
    apiToken = prompt('Unauthorized — please enter the correct token:') || '';
    opts.headers['X-Auth-Token'] = apiToken;
    const res2 = await fetch(url, opts);
    if (!res2.ok) throw new Error('HTTP ' + res2.status);
    return res2.json();
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ('HTTP ' + res.status));
  }
  return res.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------- WhatsApp session panel ----------
const WAA = '/api/waa';
let pollTimer = null;

async function refreshSession() {
  try {
    const sessions = await fetchJSON(WAA + '/sessions');
    const list = Array.isArray(sessions) ? sessions : (sessions.data || []);
    renderSessionList(list);
  } catch (e) {
    document.getElementById('sessionBody').innerHTML =
      '<div class="err">Cannot reach session API: ' + esc(e.message) + '</div>';
  }
}

function statusPill(status) {
  const map = { ready: 'ok', connected: 'ok', connecting: 'info', qr_ready: 'warn', loading: 'info',
    initializing: 'info', disconnected: 'bad', failed: 'bad', deleted: 'bad' };
  const cls = map[String(status).toLowerCase()] || 'info';
  return '<span class="pill ' + cls + '">' + esc(status) + '</span>';
}

function renderSessionList(sessions) {
  const ready = sessions.find(s => s.status === 'ready' || s.status === 'connected');
  if (ready) {
    document.getElementById('sessionBody').innerHTML =
      '<div class="row">' + statusPill(ready.status) +
      '<span class="pill ok">✅ Connected</span>' +
      '<span class="sess-line"><b>' + esc(ready.name) + '</b> · ' +
      (ready.phone ? '📞 ' + esc(ready.phone) : '') +
      (ready.pushName ? ' · ' + esc(ready.pushName) : '') + '</span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn btn-ghost" onclick="resync()">↻ Re-register webhook</button>' +
      '<button class="btn btn-reject" onclick="logoutSession(\'' + ready.id + '\')">Logout</button>' +
      '</div>' +
      '<div class="hint">Open WhatsApp → Linked devices → Link a device. Messages are received automatically; ' +
      'replies need your approval below.</div>';
    stopQrPolling();
    return;
  }

  const any = sessions[0];
  if (any) {
    document.getElementById('sessionBody').innerHTML =
      '<div class="row">' + statusPill(any.status) +
      '<span class="sess-line"><b>' + esc(any.name) + '</b></span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn btn-ghost" onclick="startQrFlow(\'' + any.id + '\')">Show QR</button>' +
      '<button class="btn btn-reject" onclick="deleteSession(\'' + any.id + '\')">Delete</button>' +
      '</div>' +
      (any.lastError ? '<div class="err">' + esc(any.lastError) + '</div>' : '') +
      '<div class="hint">Session exists but is not connected. Click “Show QR” to link your phone.</div>';
    stopQrPolling();
    return;
  }

  document.getElementById('sessionBody').innerHTML =
    '<div class="row"><input id="sessionName" value="preet" placeholder="session name">' +
    '<button class="btn btn-primary" onclick="createSession()">➕ Create &amp; Connect</button></div>' +
    '<div class="hint">No WhatsApp session yet. Give it a name, then scan the QR that appears with ' +
    'WhatsApp → Linked devices → Link a device.</div>';
}

async function createSession() {
  const name = (document.getElementById('sessionName').value || 'preet').trim();
  if (!name) return;
  try {
    const created = await fetchJSON(WAA + '/sessions', { method: 'POST', body: JSON.stringify({ name }) });
    const id = created.id || (created.data && created.data.id);
    if (!id) throw new Error('No session id returned');
    startQrFlow(id);
  } catch (e) {
    document.getElementById('sessionBody').innerHTML =
      '<div class="err">Create failed: ' + esc(e.message) + '</div>' + '<button class="btn btn-ghost" onclick="refreshSession()">← Back</button>';
  }
}

async function startQrFlow(id) {
  try {
    await fetchJSON(WAA + '/sessions/' + id + '/start', { method: 'POST' }).catch(() => {});
  } catch (e) { /* start may already be running */ }
  document.getElementById('sessionBody').innerHTML =
    '<div class="row">' + statusPill('connecting') + '<span class="sess-line">Waiting for QR…</span></div>' +
    '<div class="qr-box" id="qrBox"><div class="hint">Loading QR…</div></div>' +
    '<div class="hint">Open WhatsApp on your phone → <b>Linked devices → Link a device</b> → scan this QR.</div>';
  startQrPolling(id);
}

async function pollQr(id) {
  try {
    const data = await fetchJSON(WAA + '/sessions/' + id + '/qr');
    const qr = data.qrCode || (data.data && data.data.qrCode);
    const box = document.getElementById('qrBox');
    if (box && qr && typeof qr === 'string' && qr.startsWith('data:image')) {
      box.innerHTML = '<img src="' + qr + '" alt="QR code">';
    }
  } catch (e) { /* QR not ready yet — keep polling */ }

  // Once the session flips to ready, stop polling and resync the webhook.
  try {
    const info = await fetchJSON(WAA + '/sessions/' + id);
    const status = String(info.status).toLowerCase();
    if (status === 'ready' || status === 'connected') {
      stopQrPolling();
      await resync();
      renderConnected(info);
    }
  } catch (e) { /* session not found yet */ }
}

function renderConnected(info) {
  document.getElementById('sessionBody').innerHTML =
    '<div class="row">' + statusPill(info.status) + '<span class="pill ok">✅ Connected</span>' +
    '<span class="sess-line"><b>' + esc(info.name) + '</b> · ' +
    (info.phone ? '📞 ' + esc(info.phone) : '') + ' · ' + (info.pushName || '') + '</span>' +
    '<span style="flex:1"></span>' +
    '<button class="btn btn-ghost" onclick="resync()">↻ Re-register webhook</button>' +
    '<button class="btn btn-reject" onclick="logoutSession(\'' + info.id + '\')">Logout</button>' +
    '</div>' +
    '<div class="hint">✅ Linked! You can close your phone. Incoming messages now flow automatically — ' +
    'approve or reject their AI drafts below.</div>';
}

function startQrPolling(id) {
  stopQrPolling();
  pollTimer = setInterval(() => pollQr(id), 4000);
  pollQr(id);
}

function stopQrPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function resync() {
  try {
    const out = await fetchJSON('/api/resync', { method: 'POST' });
    alert(out.ok ? '✅ Webhook registered for session ' + (out.sessionId || '') + '.' : 'Webhook error: ' + (out.state && out.state.lastError || 'unknown'));
  } catch (e) {
    alert('Resync failed: ' + e.message);
  }
}

async function logoutSession(id) {
  if (!confirm('Log out this WhatsApp session? You will need to scan the QR again.')) return;
  try {
    await fetchJSON(WAA + '/sessions/' + id + '/logout', { method: 'POST' });
    refreshSession();
  } catch (e) { alert('Logout failed: ' + e.message); }
}

async function deleteSession(id) {
  if (!confirm('Permanently delete this session and its saved data?')) return;
  try {
    await fetchJSON(WAA + '/sessions/' + id, { method: 'DELETE' }).catch(() => {});
    refreshSession();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// ---------- Approvals ----------
async function loadAll() {
  try {
    const [approvals, patterns] = await Promise.all([
      fetchJSON('/api/approvals'),
      fetchJSON('/api/patterns'),
    ]);

    const pending = approvals.filter(a => a.status === 'pending');
    const resolved = approvals.filter(a => a.status !== 'pending');

    document.getElementById('pendingCount').textContent = pending.length;
    document.getElementById('approvedCount').textContent = approvals.filter(a => a.status === 'approved').length;
    document.getElementById('patternCount').textContent = patterns.length;
    document.getElementById('lastRefresh').textContent = 'Updated ' + new Date().toLocaleTimeString();

    const el = document.getElementById('content');

    if (currentTab === 'pending') {
      if (!pending.length) {
        el.innerHTML = '<div class="empty"><p>🎉 No pending approvals</p><p style="font-size:0.8125rem;margin-top:0.5rem">New messages will appear here for review</p></div>';
      } else {
        el.innerHTML = pending.map(a => approvalCard(a, true)).join('');
      }
    } else if (currentTab === 'resolved') {
      if (!resolved.length) {
        el.innerHTML = '<div class="empty"><p>No resolved approvals yet</p></div>';
      } else {
        el.innerHTML = resolved.map(a => approvalCard(a, false)).join('');
      }
    } else if (currentTab === 'patterns') {
      if (!patterns.length) {
        el.innerHTML = '<div class="empty"><p>📚 No patterns learned yet</p><p style="font-size:0.8125rem;margin-top:0.5rem">Approve a reply to teach the bot a new pattern</p></div>';
      } else {
        el.innerHTML = patterns.map(p => patternCard(p)).join('');
      }
    }
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Error loading: ' + e.message + '</div>';
  }
}

function approvalCard(a, showActions) {
  const cls = a.status === 'pending' ? 'status-pending'
    : a.status === 'approved' ? 'status-approved'
    : a.status === 'rejected' ? 'status-rejected'
    : 'status-expired';
  return '<div class="card">' +
    '<div class="meta">' +
      '<span class="sender">' + esc(a.sender) + '</span>' +
      '<span>' + new Date(a.createdAt).toLocaleString() + '</span>' +
      '<span class="status-badge ' + cls + '">' + a.status + '</span>' +
      '<span style="margin-left:auto;font-size:0.7rem;color:#475569">' + a.id.slice(0,8) + '</span>' +
    '</div>' +
    (a.chatSummary ? '<div class="summary">💬 ' + esc(a.chatSummary) + '</div>' : '') +
    '<div class="msg-label">📨 Incoming Message</div>' +
    '<div class="msg">' + esc(a.originalMessage) + '</div>' +
    '<div class="msg-label">🤖 AI Draft Reply</div>' +
    '<div class="draft">' + esc(a.draftReply) + '</div>' +
    (a.summary ? '<div class="summary">📋 ' + esc(a.summary) + '</div>' : '') +
    (showActions ? '<div class="actions">' +
      '<button class="btn btn-approve" onclick="approve(\'' + a.id + '\', this)">✓ Approve & Learn</button>' +
      '<button class="btn btn-reject" onclick="reject(\'' + a.id + '\', this)">✗ Reject</button>' +
    '</div>' : '') +
  '</div>';
}

function patternCard(p) {
  return '<div class="card">' +
    '<div class="meta">' +
      '<span>Uses: <b style="color:#25D366">' + p.uses + '</b></span>' +
      '<span>Created: ' + new Date(p.createdAt).toLocaleDateString() + '</span>' +
      '<span>Last used: ' + (p.lastUsed ? new Date(p.lastUsed).toLocaleString() : 'never') + '</span>' +
      '<span style="margin-left:auto;font-size:0.7rem;color:#475569">' + p.id.slice(0,8) + '</span>' +
    '</div>' +
    '<div class="msg-label">📨 Original Message</div>' +
    '<div class="msg">' + esc(p.originalMessage) + '</div>' +
    '<div class="msg-label">✅ Learned Reply</div>' +
    '<div class="draft">' + esc(p.reply) + '</div>' +
    '<div class="pattern-keywords">' + p.keywords.map(k => '<span class="keyword">' + esc(k) + '</span>').join('') + '</div>' +
  '</div>';
}

async function approve(id, btn) {
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetchJSON('/api/approvals/' + id + '/approve', { method: 'POST' });
    btn.textContent = '✅ Sent!';
    setTimeout(loadAll, 800);
  } catch (e) {
    btn.textContent = '❌ Error: ' + e.message;
    btn.disabled = false;
  }
}

async function reject(id, btn) {
  btn.disabled = true; btn.textContent = 'Rejecting...';
  try {
    await fetchJSON('/api/approvals/' + id + '/reject', { method: 'POST' });
    btn.textContent = '❌ Rejected';
    setTimeout(loadAll, 800);
  } catch (e) {
    btn.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}

function showTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  loadAll();
}

loadAll();
setInterval(loadAll, 10000);
refreshSession();
setInterval(refreshSession, 15000);
</script>
</body>
</html>
