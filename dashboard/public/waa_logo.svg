<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25D366"/>
      <stop offset="100%" style="stop-color:#128C7E"/>
    </linearGradient>
    <!-- Glow gradient -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <!-- Inner glow -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle glow overlay -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#glow)"/>

  <!-- Chat bubble outline (WhatsApp style) -->
  <g transform="translate(256, 210)" opacity="0.15">
    <path d="M-100,-70 C-100,-105 -70,-135 -30,-135 L30,-135 C70,-135 100,-105 100,-70 L100,10 C100,45 70,75 30,75 L-10,75 L-45,110 L-40,75 L-30,75 C-70,75 -100,45 -100,10 Z" 
          fill="white" stroke="none"/>
  </g>

  <!-- Circuit/automation lines (left) -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <line x1="80" y1="180" x2="130" y2="180"/>
    <line x1="130" y1="180" x2="130" y2="220"/>
    <circle cx="80" cy="180" r="4" fill="white"/>
    <circle cx="130" cy="220" r="4" fill="white"/>
    
    <line x1="80" y1="300" x2="130" y2="300"/>
    <line x1="130" y1="300" x2="130" y2="260"/>
    <circle cx="80" cy="300" r="4" fill="white"/>
    <circle cx="130" cy="260" r="4" fill="white"/>
  </g>

  <!-- Circuit/automation lines (right) -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <line x1="432" y1="180" x2="382" y2="180"/>
    <line x1="382" y1="180" x2="382" y2="220"/>
    <circle cx="432" cy="180" r="4" fill="white"/>
    <circle cx="382" cy="220" r="4" fill="white"/>
    
    <line x1="432" y1="300" x2="382" y2="300"/>
    <line x1="382" y1="300" x2="382" y2="260"/>
    <circle cx="432" cy="300" r="4" fill="white"/>
    <circle cx="382" cy="260" r="4" fill="white"/>
  </g>

  <!-- Robot/Bot face (center) -->
  <g transform="translate(256, 220)" filter="url(#innerGlow)">
    <!-- Head -->
    <rect x="-55" y="-55" width="110" height="95" rx="22" ry="22" fill="white" opacity="0.95"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-55" x2="0" y2="-80" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="-85" r="8" fill="white" opacity="0.9"/>
    
    <!-- Eyes -->
    <circle cx="-22" cy="-15" r="10" fill="#25D366"/>
    <circle cx="22" cy="-15" r="10" fill="#25D366"/>
    <circle cx="-22" cy="-15" r="4" fill="white"/>
    <circle cx="22" cy="-15" r="4" fill="white"/>
    
    <!-- Smile -->
    <path d="M-20,18 Q0,35 20,18" fill="none" stroke="#25D366" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Chat bubble from robot -->
    <g transform="translate(50, -40)">
      <path d="M0,0 L25,0 C30,0 35,5 35,10 L35,25 C35,30 30,35 25,35 L10,35 L3,45 L5,35 L0,35 C-5,35 -10,30 -10,25 L-10,10 C-10,5 -5,0 0,0 Z" 
            fill="white" opacity="0.9"/>
      <!-- Dots in chat bubble -->
      <circle cx="5" cy="17" r="3" fill="#25D366"/>
      <circle cx="15" cy="17" r="3" fill="#25D366"/>
      <circle cx="25" cy="17" r="3" fill="#25D366"/>
    </g>
  </g>

  <!-- Gear icon (bottom right, small) -->
  <g transform="translate(380, 360)" opacity="0.2">
    <circle cx="0" cy="0" r="20" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    <line x1="0" y1="-20" x2="0" y2="-28" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="-28" y2="0" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-14" y1="-14" x2="-20" y2="-20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="20" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="-14" y1="14" x2="-20" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="20" y2="-20" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- WAA text -->
  <text x="256" y="385" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="72" font-weight="800" fill="white" letter-spacing="6" opacity="0.95">
    WAA
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="418" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="18" font-weight="500" fill="white" letter-spacing="4" opacity="0.6" text-transform="uppercase">
    WHATSAPP AUTOMATION
  </text>
</svg>
